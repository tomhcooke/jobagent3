name: Daily Job Search

on:
  schedule:
    # Runs at 13:00 UTC daily = 8:00 AM Chicago (CDT) / 7:00 AM (CST)
    - cron: "0 13 * * *"
  workflow_dispatch:   # lets you trigger a run manually from the Actions tab
    inputs:
      max_score_calls:
        description: >-
          Cap on real Claude API calls this run. Leave blank for a normal,
          fully-scored run. Set to 0 to test the rest of the pipeline
          (fetch/filter/dashboard/commit) for free. Set to a small number
          (e.g. 2) to cheaply confirm live scoring still works end to end.
        required: false
        default: ""
      rescore_only:
        description: >-
          Skip the full company/board scan and just fill in real scores for
          matches already recorded but never scored (e.g. left over from a
          max_score_calls-capped run). Much cheaper than a full run since it
          only re-hits boards that actually have a pending match.
        required: false
        type: boolean
        default: false
      backfill_descriptions:
        description: >-
          Fetch and store the job description for any match recorded before
          descriptions were kept. Uses no Claude API credits -- it re-fetches
          the postings over plain HTTP and never calls the scorer.
        required: false
        type: boolean
        default: false

# The default GITHUB_TOKEN is read-only unless a workflow explicitly asks
# for more -- without this, "Commit updated results" below builds a commit
# on the runner but the final `git push` is rejected with a 403, and that
# commit is lost when the runner is torn down (silently, since the old
# `|| echo "Nothing to push"` swallowed the failure).
permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          MAX_SCORE_CALLS: ${{ github.event.inputs.max_score_calls }}
          RESCORE_ONLY: ${{ github.event.inputs.rescore_only }}
          BACKFILL_DESCRIPTIONS: ${{ github.event.inputs.backfill_descriptions }}
        run: python job_agent.py

      - name: Commit updated results
        run: |
          git config user.name "job-agent"
          git config user.email "actions@github.com"
          git add seen_jobs.db matches.md company_status.csv docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update job matches $(date -u +%Y-%m-%d)"
            git push
          fi
